<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PacePlan</title>
<style>:root{--b:#287cc1;--g:#249164;--i:#173448;--m:#627989;--l:#d4e3eb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--i);background:linear-gradient(135deg,#edf8ff,#f1fff7)}button,input,select{font:inherit}.wrap{max-width:1150px;margin:auto;padding:18px}.hero{display:flex;gap:12px;align-items:center}.logo{font-size:28px;background:linear-gradient(135deg,var(--b),var(--g));padding:12px;border-radius:15px}.card,.week{background:#fff;border:1px solid var(--l);border-radius:18px;padding:18px;margin-top:15px;box-shadow:0 10px 28px #23506f18}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label,.label{font-weight:750;display:block}select,input{width:100%;padding:10px;min-height:44px;border:1px solid #bfd2dd;border-radius:10px}.time{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.days{display:flex;flex-wrap:wrap;gap:7px}.days label{padding:9px;border:1px solid var(--l);border-radius:999px}.days input{width:auto;min-height:auto}.status{padding:10px;margin-top:8px;border-radius:10px;font-weight:700}.good{background:#e7f8ef;color:#16734a}.warn{background:#fff6dc;color:#875900}.bad{background:#ffefed;color:#a61b13}.hide{display:none!important}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:800}.primary{color:#fff;background:linear-gradient(135deg,var(--b),var(--g))}.secondary{background:#eaf4f8}.summary{background:linear-gradient(135deg,#e8f3ff,#e8faef)}.pacegrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.pace,.workout{border:1px solid var(--l);border-radius:12px;padding:11px}.pace b,.part b{display:block;font-size:11px;text-transform:uppercase;color:var(--m)}.week{padding:0;overflow:hidden}.weekhead{padding:13px;background:#edf7f5;display:flex;justify-content:space-between}.workouts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}.workout{position:relative}.done{background:#eaf8ef}.check{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:2px solid #94aebb;background:white}.meta{font-size:12px;color:var(--m);font-weight:750}.part{margin-top:9px}.recovery{background:#f7fafb;border-style:dashed}.progress{height:10px;background:#dce8ed;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--b),var(--g))}@media(max-width:760px){.grid,.time,.pacegrid,.workouts{grid-template-columns:1fr}.btn{width:100%}}@media print{.no-print,.check,.hero{display:none!important}.week{break-inside:avoid;box-shadow:none}.workouts{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><main class="wrap"><header class="hero"><div class="logo">🏃</div><div><h1>PacePlan</h1><p>Detailed week-by-week running programmes</p></div></header>
<section id="form" class="card"><form id="planner"><div class="grid">
<div><label>Goal race<select id="goal"><option value="5">5 km</option><option value="10">10 km</option><option value="21.0975" selected>Half Marathon</option><option value="42.195">Marathon</option></select></label></div>
<div><label>Programme length<select id="weeks"><option>8</option><option>10</option><option selected>12</option><option>14</option><option>16</option></select></label></div>
<div><label>Running days per week<select id="freq"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></label></div>
<div><label>Long-run day<select id="longDay"><option value="6" selected>Saturday</option><option value="0">Sunday</option></select></label></div>
<div><label>Units<select id="unit"><option value="km">Kilometres</option><option value="mi">Miles</option></select></label></div>
<div class="full"><span class="label">Training days</span><div id="trainingDays" class="days"></div></div>
<div class="full"><span class="label">Recent race result</span><select id="recentDistance"><option value="">No recent result</option><option value="5" selected>5 km</option><option value="10">10 km</option><option value="21.0975">Half Marathon</option></select><div class="time"><label>Hours<input id="rh" type="number" inputmode="numeric" value="0"></label><label>Minutes<input id="rm" type="number" inputmode="numeric" value="24"></label><label>Seconds<input id="rs" type="number" inputmode="numeric" value="30"></label></div><div id="validation" class="status hide"></div></div>
</div><div id="error" class="status bad hide"></div><div class="btns"><button class="btn primary" type="submit">Generate My Programme</button></div></form></section>
<section id="results" class="hide"><div class="card summary"><h2 id="title"></h2><p id="summary"></p><div class="progress"><div id="bar" class="bar"></div></div><p id="progressText"></p></div><div class="card"><h3>Training paces</h3><div id="paces" class="pacegrid"></div></div><div id="calendar"></div><div class="btns no-print"><button id="edit" class="btn secondary">Edit inputs</button><button id="print" class="btn secondary">Print / Save PDF</button><button id="clear" class="btn secondary">Delete saved plan</button></div></section></main>
<script>'use strict';const $=s=>document.querySelector(s),D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],GN={5:'5 km',10:'10 km','21.0975':'Half Marathon','42.195':'Marathon'},R={5:[720,900,3600,7200],10:[1500,1800,7200,10800],21.0975:[3300,3600,14400,21600]};let plan=null;
function fmt(s){s=Math.round(s);let h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`}
function dt(k,u){return u==='mi'?(k/1.609344).toFixed(k<8?1:0)+' mi':k.toFixed(k<10?1:0)+' km'}function dur(k,p){let m=Math.round(k*p/60);return m<60?m+' min':Math.floor(m/60)+' hr '+String(m%60).padStart(2,'0')+' min'}function half(v){return Math.round(v*2)/2}
function time(){let v=[$('#rh').value,$('#rm').value,$('#rs').value];if(v.some(x=>x===''))throw Error('Complete the recent race time.');v=v.map(Number);if(v.some(x=>!Number.isInteger(x)||x<0)||v[1]>59||v[2]>59)throw Error('Minutes and seconds must be between 0 and 59.');let n=v[0]*3600+v[1]*60+v[2];if(!n)throw Error('Race time must be greater than zero.');return n}
function validate(){let d=+$('#recentDistance').value,b=$('#validation');if(!d){b.className='status hide';return null}try{let n=time(),r=R[d],s=n<r[0]||n>r[3]?'bad':n<r[1]||n>r[2]?'warn':'good';b.className='status '+s;b.textContent=s==='good'?'✓ Valid result':s==='warn'?'⚠ Unusual result; verify before continuing':'✕ Outside accepted range';return {n,s}}catch(e){b.className='status bad';b.textContent='✕ '+e.message;return {s:'bad'}}}
function drawDays(){let n=+$('#freq').value,l=+$('#longDay').value,p=n===2?[2,l]:n===3?[2,4,l]:n===4?[1,3,5,l]:n===5?[1,2,4,5,l]:[1,2,3,4,5,l];p=[...new Set(p)];for(let i=0;p.length<n;i++)if(!p.includes(i))p.push(i);$('#trainingDays').innerHTML=D.map((x,i)=>`<label><input name="td" type="checkbox" value="${i}" ${p.includes(i)?'checked':''}> ${x}</label>`).join('')}
function st(n){return {2:['Easy Run','Long Run'],3:['Easy Run','Intervals','Long Run'],4:['Easy Run','Intervals','Tempo Run','Long Run'],5:['Recovery Run','Easy Run','Intervals','Tempo Run','Long Run'],6:['Recovery Run','Easy Run','Intervals','Easy Run','Tempo Run','Long Run']}[n]}
function build(){let rr=validate();if(rr&&rr.s==='bad')throw Error('Correct the recent race time.');let sel=[...document.querySelectorAll('[name=td]:checked')].map(x=>+x.value),f=+$('#freq').value,l=+$('#longDay').value;if(sel.length!==f)throw Error(`Choose exactly ${f} training days.`);if(!sel.includes(l))throw Error('Long-run day must be selected.');let g=+$('#goal').value,wks=+$('#weeks').value,u=$('#unit').value,rd=+$('#recentDistance').value,base=rr?rr.n/rd:390,pred=rr?rr.n*Math.pow(g/rd,1.06):base*g,mul=u==='mi'?1.609344:1,pd=[['Recovery',base*1.34],['Easy',base*1.22],['Long',base*1.28],['Tempo',base*1.06],['Intervals',base*.93],['Goal race',pred/g]],start={5:3.5,10:4.5,'21.0975':6,'42.195':8}[g],max={5:8,10:13,'21.0975':20,'42.195':32}[g],cal=[];
for(let w=1;w<=wks;w++){let prog=(w-1)/(wks-1),factor=w===wks?.45:w===wks-1?.65:w%4===0?.82:1,long=half(Math.min(max,(start+(max-start)*prog)*factor)),easy=half(Math.max(2.5,long*(g>=21?.45:.55))),rec=half(Math.max(2.5,easy*.7)),tempo=half(Math.min(g>=21?8:5,2+w*.45)),rep=w<Math.ceil(wks/2)?400:800,reps=Math.min(rep===400?10:7,4+Math.floor(w/2)),intTotal=half(reps*rep/1000+3.5),ordered=[...sel].sort((a,b)=>a-b),items=st(f).map((t,i)=>{let day=t==='Long Run'?l:ordered[i],km,pi,structure,main;if(t==='Long Run'){km=long;pi=2;structure=`${dt(km,u)} continuous easy running`;main=`Run ${dt(km,u)} at a conversational effort.`}else if(t==='Intervals'){km=intTotal;pi=4;structure=`2 km warm-up + ${reps} × ${rep} m fast with easy recovery + cool-down`;main=`Complete ${reps} × ${rep} m at interval pace.`}else if(t==='Tempo Run'){km=half(tempo+3);pi=3;structure=`1.5 km easy + ${dt(tempo,u)} tempo + 1.5 km easy`;main=`Run the middle ${dt(tempo,u)} at controlled tempo effort.`}else if(t==='Recovery Run'){km=rec;pi=0;structure=`${dt(km,u)} very easy run or run/walk`;main='Finish feeling fresher than when you started.'}else{km=easy;pi=1;structure=`${dt(km,u)} continuous easy running`;main=`Run ${dt(km,u)} conversationally.`}return{id:`w${w}-${i}`,type:t,day:D[day],distance:dt(km,u),duration:dur(km,pd[pi][1]),pace:fmt(pd[pi][1]*mul)+' /'+u,structure,main,km}});if(w===wks)items.push({id:'race',type:'Race Day',day:'Choose your race day',distance:dt(g,u),duration:fmt(pred),pace:fmt(pred/g*mul)+' /'+u,structure:`Complete your ${GN[g]} event`,main:'Start controlled and build gradually.',km:g});let phase=w===wks?'Race Week':w>=wks-1?'Taper':w>wks*.65?'Peak':w>wks*.3?'Build':'Base',total=half(items.reduce((a,x)=>a+x.km,0));cal.push({w,phase,total:dt(total,u),items})}return{g,wks,f,l,sel,u,pred,pd,mul,cal,done:[]}}
function card(x){let done=plan.done.includes(x.id);return `<article class="workout ${done?'done':''}" data-id="${x.id}"><button class="check">${done?'✓':''}</button><h3>${x.type}</h3><div class="meta">${x.day}<br>${x.distance} • ${x.duration}<br>${x.pace}</div><div class="part"><b>Warm-up</b>${x.type==='Intervals'||x.type==='Tempo Run'?'Included below':'5–10 min easy movement before the prescribed distance.'}</div><div class="part"><b>Session structure</b>${x.structure}</div><div class="part"><b>Main run</b>${x.main}</div><div class="part"><b>Cool-down</b>${x.type==='Intervals'||x.type==='Tempo Run'?'Included above':'5–10 min walking after the prescribed distance.'}</div></article>`}
function save(){localStorage.setItem('paceplan-detailed',JSON.stringify(plan))}function render(){if(!plan)return;$('#form').classList.add('hide');$('#results').classList.remove('hide');$('#title').textContent=`Your ${plan.wks}-week ${GN[plan.g]} programme`;$('#summary').textContent=`Generated goal time: ${fmt(plan.pred)}. Every workout includes distance, duration and structure.`;$('#paces').innerHTML=plan.pd.map(x=>`<div class="pace"><b>${x[0]}</b>${fmt(x[1]*plan.mul)} /${plan.u}</div>`).join('');$('#calendar').innerHTML=plan.cal.map(w=>`<section class="week"><div class="weekhead"><strong>${w.phase==='Race Week'?'Race Week':'Week '+w.w}</strong><span>${w.phase} • ${w.total}</span></div><div class="workouts">${w.items.map(card).join('')}<article class="workout recovery"><h3>Rest & Recovery</h3><div class="part"><b>Guidance</b>Sleep, hydration, gentle walking and optional mobility.</div></article></div></section>`).join('');document.querySelectorAll('.check').forEach(b=>b.onclick=()=>{let id=b.parentElement.dataset.id,i=plan.done.indexOf(id);i<0?plan.done.push(id):plan.done.splice(i,1);save();render()});let total=plan.cal.reduce((a,w)=>a+w.items.length,0),pct=Math.round(plan.done.length/total*100);$('#bar').style.width=pct+'%';$('#progressText').textContent=`${plan.done.length} of ${total} workouts completed (${pct}%)`}
$('#planner').onsubmit=e=>{e.preventDefault();let b=$('#error');b.className='status hide';try{plan=build();save();render()}catch(x){b.textContent='✕ '+x.message;b.className='status bad'}};$('#freq').onchange=drawDays;$('#longDay').onchange=drawDays;['recentDistance','rh','rm','rs'].forEach(id=>$('#'+id).oninput=validate);$('#edit').onclick=()=>{$('#results').classList.add('hide');$('#form').classList.remove('hide')};$('#print').onclick=()=>window.print();$('#clear').onclick=()=>{localStorage.removeItem('paceplan-detailed');location.reload()};drawDays();validate();try{plan=JSON.parse(localStorage.getItem('paceplan-detailed'));if(plan)render()}catch{}
</script></body></html>
